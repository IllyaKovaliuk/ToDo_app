{% extends "base.html" %}

{% block content %}
  <h1>Tags <a href="{% url 'todo_app:tag_create' %}" class="btn btn-primary" style="float: right; margin: 15px">Add</a></h1>
      <table class="table">
    <tr>
      <th>Name</th>
      <th>Update</th>
      <th>Delete</th>
    </tr>

    {% for tag in tags %}
      <tr>
        <td>{{ tag.name }}</td>
        <td><a href="{% url 'todo_app:tag_update' tag.id %}">Update</a></td>
        <td><a href="{% url 'todo_app:tag_delete' tag.id %}">Delete</a></td>

      </tr>
    {% endfor %}

  </table>
{% endblock %}
